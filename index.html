<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChessGym</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="libs/chessboard-1.0.0.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <main class="main">
      <div class="main-column board-column">
        <section class="board-panel">
          <div id="board"></div>
        </section>
      </div>
    </main>

    <footer class="footer-bar">
      <div class="footer-controls">
        <div class="header-actions">
          <button id="prevBtn" class="ghost">Prev</button>
          <button id="nextBtn" class="ghost">Next</button>
          <button id="boardZoomOut" class="ghost" aria-label="Reduce board size">-</button>
          <button id="boardZoomIn" class="ghost" aria-label="Increase board size">+</button>
          <button id="hintBtn" class="ghost" title="Hints alternate between highlighting the piece and showing the prompt.">Hint</button>
          <button id="freeBtn" class="ghost" aria-pressed="false" title="Enable free play for both sides.">Free</button>
          <button id="newLineBtn" class="ghost" title="Create a new study line from move notation.">New Line</button>
          <button id="lichessBtn" class="ghost">Lich</button>
        </div>
      </div>
      <div class="footer-prompt">
        <div id="commentBox" class="comment-box footer-comment"></div>
      </div>
      <div class="footer-stats">
        <div class="footer-stats-row">
          <div class="field" id="strengthField">
            <label for="strengthSelect">Engine strength</label>
            <select id="strengthSelect" aria-label="Engine strength">
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="strong">Strong</option>
            </select>
          </div>
          <button id="sessionSummary" class="session-summary" type="button" aria-expanded="false" aria-controls="sessionSelectors">
            <div class="session-main">
              <p id="lineStatus">Selecting your next line…</p>
            </div>
            <div class="session-stats">
              <div class="progress" id="progressInfo">
                <span id="progressText"></span>
              </div>
            </div>
          </button>
        </div>
        <div class="session-selectors" id="sessionSelectors" hidden>
          <div class="field">
            <div class="select-with-thumb custom-select">
              <img id="openingThumb" class="select-thumb is-placeholder" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="" />
              <button id="openingSelectBtn" class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                Select opening
              </button>
              <div id="openingSelectList" class="select-list" role="listbox" aria-label="Opening options"></div>
            </div>
          </div>
          <div class="field">
            <div class="select-with-thumb custom-select">
              <img id="lineThumb" class="select-thumb is-placeholder" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="" />
              <button id="lineSelectBtn" class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                Select line
              </button>
              <div id="lineSelectList" class="select-list" role="listbox" aria-label="Line options"></div>
            </div>
            <button id="dueBtn" class="ghost">Study Due Lines</button>
          </div>
          <div class="field">
            <div class="elo-filter" id="eloFilter" role="group" aria-label="Line elo filter">
              <label class="elo-option"><input type="checkbox" name="eloFilter" value="900" />900</label>
              <label class="elo-option"><input type="checkbox" name="eloFilter" value="1200" />1200</label>
              <label class="elo-option"><input type="checkbox" name="eloFilter" value="1500" />1500</label>
              <label class="elo-option"><input type="checkbox" name="eloFilter" value="1800" />1800</label>
            </div>
          </div>
          <div class="field">
            <select id="modeSelect" aria-label="Mode">
              <option value="learning">Learning</option>
              <option value="practice">Practice</option>
              <option value="game">Game</option>
            </select>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <div id="loadingOverlay" class="overlay">
    <div class="spinner">Loading…</div>
  </div>

  <div id="newLineModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="newLineTitle">
    <div class="modal-panel new-line-panel">
      <div class="modal-header">
        <h2 id="newLineTitle">New Line</h2>
        <button id="newLineClose" class="icon-button" type="button" aria-label="Close">×</button>
      </div>
      <div class="new-line-grid">
        <label>
          Writer URL
          <input id="newLineWriterUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" />
        </label>
        <label>
          Write token
          <input id="newLineWriteToken" type="password" autocomplete="off" placeholder="Optional" />
        </label>
        <label>
          Opening ID
          <input id="newLineOpeningId" type="text" />
        </label>
        <label>
          Opening name
          <input id="newLineOpeningName" type="text" />
        </label>
        <label>
          Line name
          <input id="newLineName" type="text" />
        </label>
        <label>
          Line ID
          <input id="newLineId" type="text" placeholder="Auto from line name" />
        </label>
        <label>
          Practice side
          <select id="newLineDrillSide">
            <option value="white">White</option>
            <option value="black">Black</option>
          </select>
        </label>
        <label>
          Notation
          <select id="newLineNotation">
            <option value="auto">Auto</option>
            <option value="uci">UCI</option>
            <option value="san">SAN / PGN</option>
          </select>
        </label>
        <label>
          ELO
          <input id="newLineElo" type="text" placeholder="Optional" />
        </label>
        <label>
          Priority
          <input id="newLinePriority" type="number" min="0" step="1" value="1" />
        </label>
        <label class="wide-field">
          Start FEN
          <input id="newLineStartFen" type="text" placeholder="Blank = normal start" />
        </label>
        <label class="wide-field">
          Moves
          <textarea id="newLineMoves" rows="5" placeholder="e2e4 e7e5 g1f3 or 1. e4 e5 2. Nf3"></textarea>
        </label>
        <label class="checkbox-field">
          <input id="newLineCreateOpening" type="checkbox" />
          Create opening row
        </label>
      </div>
      <div class="modal-actions">
        <button id="newLineGenerate" class="ghost" type="button">Generate rows</button>
        <button id="newLineCopyRows" class="ghost" type="button">Copy rows</button>
        <button id="newLineSubmit" class="ghost primary-action" type="button">Write to Sheets</button>
      </div>
      <pre id="newLineOutput" class="new-line-output" aria-live="polite"></pre>
    </div>
  </div>

  <script src="libs/jquery.min.js"></script>
  <script src="libs/chess.min.js"></script>
  <script src="libs/chessboard-1.0.0.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
